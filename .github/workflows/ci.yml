name: CI

on:
  push:
    branches: [main, "improve/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python CI
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check frontend JavaScript syntax
        run: |
          node --check src/static/app.js
          node --check src/static/flight-recorder.js
          node --check src/static/diagnostics.js
          node --check src/static/hardware.js
          node --check src/static/storage.js
          node --check src/static/nexus-enhancements.js
          node --check src/static/network-analytics.js
      - name: Compile Python sources
        run: python -m compileall -q server.py telemetry_store.py diagnostics.py hardware.py storage_metrics.py process_intelligence.py settings_store.py desktop_app.py network_metrics.py analytics.py tests
      - name: Run tests
        run: python -m pytest -q
