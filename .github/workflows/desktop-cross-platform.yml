name: Cross-platform desktop setup checks

on:
  push:
    branches: [main, "improve/**"]
    paths:
      - "nexus_dash/desktop/**"
      - "scripts/setup_linux.sh"
      - "scripts/setup_macos.sh"
      - "requirements-desktop.txt"
      - ".github/workflows/desktop-cross-platform.yml"
  pull_request:
    branches: [main]
    paths:
      - "nexus_dash/desktop/**"
      - "scripts/setup_linux.sh"
      - "scripts/setup_macos.sh"
      - "requirements-desktop.txt"
      - ".github/workflows/desktop-cross-platform.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop-smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.12"
          - os: macos-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-desktop.txt
      - name: Install Linux WebKitGTK prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi python3-gi-cairo gir1.2-gtk-3.0 libwebkit2gtk-4.1-0 gir1.2-webkit2-4.1
      - name: Install desktop dependencies
        run: python -m pip install -r requirements-dev.txt -r requirements-desktop.txt
      - name: Validate setup scripts
        if: runner.os == 'Linux'
        run: |
          bash -n scripts/setup_linux.sh
          bash -n scripts/setup_macos.sh
      - name: Validate Python and frontend
        run: |
          python -m compileall -q nexus_dash desktop_app.py
          python -m pytest -q
